<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attachment</title>
</head>
<body>
<h1>View Attachment</h1>
<div th:if="${isPdf}">
    <iframe th:src="${fileData}" width="100%" height="600px"></iframe> <!-- Display PDF -->
</div>
<div th:if="${!isPdf}">
    <img th:src="${fileData}" alt="${fileName}" /> <!-- Display Image -->
</div>
<p>File Name: <span th:text="${fileName}"></span></p>
</body>
</html>
